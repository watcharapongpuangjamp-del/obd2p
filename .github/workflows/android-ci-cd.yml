name: Thai Car OBD-II Pro Android CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed Release APK & AAB'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Unit Tests & Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and debug.keystore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Run Unit Tests (Debug)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint (Debug)
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  build-debug-apk:
    name: Build Debug APK
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and debug.keystore
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          base64 -d debug.keystore.base64 > debug.keystore

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package Debug APK & Checksum
        run: |
          mkdir -p dist/debug
          cp app/build/outputs/apk/debug/app-debug.apk "dist/debug/thai-car-obd2-pro-debug-b${{ github.run_number }}.apk"
          (cd dist/debug && sha256sum *.apk > SHA256SUMS-debug.txt)

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thai-car-obd2-pro-debug-apk
          path: dist/debug/
          retention-days: 30

  build-release-apk:
    name: Build Signed Release APK & AAB
    needs: [verify]
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Signing Keystore & Environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          base64 -d debug.keystore.base64 > debug.keystore

          KEYSTORE_FILE="${{ runner.temp }}/release-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "SIGNING_MODE=production" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ "$IS_TAG_RELEASE" = "true" ]; then
            echo "::error::Tagged release requires GitHub Secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, and RELEASE_KEY_PASSWORD (keyAlias: upload)."
            exit 1
          else
            echo "::warning::Release secrets not configured; generating ephemeral CI upload keystore for non-tag build."
            EPHEMERAL_PASS="ci-ephemeral-${{ github.run_id }}"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$EPHEMERAL_PASS" \
              -alias upload \
              -keypass "$EPHEMERAL_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -dname "CN=Thai Car OBD-II Pro CI, O=CI, C=TH"
            echo "SIGNING_MODE=ci-ephemeral" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EPHEMERAL_PASS" >> "$GITHUB_ENV"
          fi

      - name: Assemble Release APK & App Bundle
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Package Release Artifacts & Checksums
        run: |
          mkdir -p dist/release
          RAW_REF="${GITHUB_REF_NAME:-b${{ github.run_number }}}"
          VERSION_TAG="${RAW_REF//\//-}"
          SUFFIX="${SIGNING_MODE}"
          cp app/build/outputs/apk/release/app-release.apk "dist/release/thai-car-obd2-pro-${VERSION_TAG}-${SUFFIX}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/release/thai-car-obd2-pro-${VERSION_TAG}-${SUFFIX}.aab"
          (cd dist/release && sha256sum * > SHA256SUMS-release.txt)

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thai-car-obd2-pro-release-artifacts
          path: dist/release/
          retention-days: 90

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-debug-apk, build-release-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: thai-car-obd2-pro-release-artifacts
          path: release-assets

      - name: Download Debug APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: thai-car-obd2-pro-debug-apk
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
